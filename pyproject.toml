[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "utmost"
version = "0.1.0"
description = "UTMOST: a multi-task model for assessing emotional speech synthesis"
readme = "README.md"
requires-python = ">=3.9"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [
    { name = "Joonyong Park" }, { name = "Hounsu Kim" }, { name = "Yoonjeong Park" }, { name = "Ryota Kawamatsu" },
    { name = "Wataru Nakata" }, { name = "Yuki Saito" }, { name = "Satoru Fukayama" }, { name = "Juhan Nam" },
]
dependencies = [
    "torch>=2.0",
    "soundfile>=0.12",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/sarulab-speech/UTMOST"
Weights = "https://huggingface.co/sarulab-speech/UTMOST"

[project.scripts]
utmost = "utmost.cli:main"

[tool.setuptools]
packages = ["utmost"]
