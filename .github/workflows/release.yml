# Publishes the `utmost` package to PyPI with Trusted Publishing (no API token).
#
# One-time setup
#   1. PyPI (https://pypi.org/manage/account/publishing/) -> "Add a new pending publisher":
#        PyPI project name: utmost, Owner: sarulab-speech, Repository: UTMOST,
#        Workflow: release.yml, Environment: pypi
#      Do the same on TestPyPI (https://test.pypi.org) with Environment: testpypi.
#   2. GitHub repository -> Settings -> Environments: create `pypi` and `testpypi`
#      (optionally require a reviewer for `pypi`).
#
# Releasing
#   - Trial run: Actions -> release -> "Run workflow" publishes to TestPyPI.
#   - Release: bump `version` in pyproject.toml and utmost/__init__.py, commit, then
#       git tag v0.1.0 && git push origin v0.1.0
#     The tag must equal the package version; the build job checks it.
#   A version number can be uploaded only once to each index, so bump it for every trial run.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[test]"
      - run: pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('utmost/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }
          test "$version" = "$init" || { echo "pyproject $version != utmost.__version__ $init"; exit 1; }
      - run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/utmost/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/utmost/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
